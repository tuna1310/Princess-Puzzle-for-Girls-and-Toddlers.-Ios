name: PrincessPuzzle
options:
  bundleIdPrefix: com.thasmobi
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PrincessPuzzle:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PrincessPuzzle
        excludes:
          - "Resources/**"
    resources:
      - path: PrincessPuzzle/Resources/Assets.xcassets
      - path: PrincessPuzzle/Resources/PrincessPuzzle.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thasmobi.physicsPuzzle05
        INFOPLIST_FILE: PrincessPuzzle/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      testTargets:
        - PrincessPuzzleTests
      gatherCoverageData: true

  PrincessPuzzleTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: PrincessPuzzle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thasmobi.physicsPuzzle05Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PrincessPuzzle.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PrincessPuzzle"
        BUNDLE_LOADER: "$(TEST_HOST)"
